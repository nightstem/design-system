name: Publish

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect release commit
        id: release
        run: |
          MSG=$(git log -1 --pretty=%s)
          if [[ "$MSG" =~ ^release:\ (@[a-zA-Z0-9/@-]+)@([0-9].+)$ ]]; then
            PKG="${BASH_REMATCH[1]}"
            VER="${BASH_REMATCH[2]}"
            echo "package=$PKG" >> "$GITHUB_OUTPUT"
            if [[ "$VER" =~ alpha ]]; then
              echo "tag=alpha" >> "$GITHUB_OUTPUT"
            elif [[ "$VER" =~ beta ]]; then
              echo "tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.is_release == 'true'

      - uses: actions/setup-node@v4
        if: steps.release.outputs.is_release == 'true'
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        if: steps.release.outputs.is_release == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.release.outputs.is_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.release.outputs.is_release == 'true'
        run: pnpm --filter '${{ steps.release.outputs.package }}' --if-present build

      - name: Resolve package directory
        if: steps.release.outputs.is_release == 'true'
        id: pkg
        run: |
          case "${{ steps.release.outputs.package }}" in
            "@nightstem/tokens")
              echo "dir=packages/tokens" >> "$GITHUB_OUTPUT"
              ;;
            "@nightstem/ui")
              echo "dir=packages/ui" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown package: ${{ steps.release.outputs.package }}"
              exit 1
              ;;
          esac

      - name: Publish to npm
        if: steps.release.outputs.is_release == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm publish \
            --access public \
            --tag ${{ steps.release.outputs.tag }}
